<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservations | The Freepaw Underground</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body class="reservations-page">

<header>

    <nav class="navbar navbar-expand-lg site-navbar">

        <div class="container">

            <a class="navbar-brand d-flex align-items-center"
               href="index.html">

                <img src="images/freepawlogo.png"
                     alt="The Freepaw Underground logo"
                     class="navbar-logo">

                <span>The Freepaw Underground</span>

            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="index.html">
                        Home
                    </a>

                    <a class="nav-link" href="about.html">
                        About
                    </a>

                    <a class="nav-link" href="menu.html">
                        Menu
                    </a>

                    <a class="nav-link active" href="reservations.html">
                        Reservations
                    </a>

                </div>

            </div>

        </div>

    </nav>

</header>

<main class="container py-5">

    <section class="page-heading">

        <h1>Reserve a Table</h1>

        <p>
            Reservations are request only. Our chocolate shop is hidden
            beneath the city, so we review every request before
            confirming your table.
        </p>

    </section>

    <section class="reservation-section card">

        <div class="row g-4 align-items-start">

            <div class="col-lg-6">

                <div class="reservation-image">

                    <img src="images/img3.png"
                         alt="Chocolate desserts at The Freepaw Underground">

                </div>

            </div>

            <div class="col-lg-6">

                <div id="reservation-message"></div>

                <form id="reservation-form">

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               maxlength="20"
                               class="form-control">

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control">

                    </div>

                    <div class="form-group">

                        <label for="party-size">
                            Party Size
                        </label>

                        <select id="party-size"
                                name="party-size"
                                class="form-select">

                            <option value="">
                                Select party size
                            </option>

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input type="date"
                               id="date"
                               name="date"
                               class="form-control">

                    </div>

                    <div class="form-group">

                        <label for="time">
                            Time
                        </label>

                        <input type="time"
                               id="time"
                               name="time"
                               class="form-control">

                    </div>

                    <fieldset>

                        <legend>
                            Seating Preference
                        </legend>

                        <div class="radio-option">

                            <input type="radio"
                                   id="indoor"
                                   name="seating"
                                   value="indoor">

                            <label for="indoor">
                                Underground Dining Room
                            </label>

                        </div>

                        <div class="radio-option">

                            <input type="radio"
                                   id="window"
                                   name="seating"
                                   value="window">

                            <label for="window">
                                Window Table
                            </label>

                        </div>

                        <div class="radio-option">

                            <input type="radio"
                                   id="communal"
                                   name="seating"
                                   value="communal">

                            <label for="communal">
                                Communal Table
                            </label>

                        </div>

                    </fieldset>

                    <div class="form-group">
                        <label for="dietary-notes">Dietary Notes</label>
                        <textarea
                                id="dietary-notes"
                                class="form-control"
                                rows="4"
                                maxlength="30"
                                placeholder="Allergies or dietary requests"></textarea>
                        <div id="character-counter" class="form-text">
                            0/30 characters
                        </div>
                    </div>

                    <div class="checkbox-option">

                        <input type="checkbox"
                               id="newsletter"
                               name="newsletter"
                               value="yes">

                        <label for="newsletter">
                            Sign me up for the Underground newsletter.
                        </label>

                    </div>

                    <div class="button-group">

                        <button type="submit"
                                class="btn btn-primary">

                            Submit Request

                        </button>

                        <button type="reset"
                                class="btn btn-secondary">

                            Reset Form

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>

<footer>

    <p>&copy; 2026 The Freepaw Underground</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
