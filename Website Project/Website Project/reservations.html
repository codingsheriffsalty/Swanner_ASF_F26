
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservations | The Freepaw Underground</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="reservations.html">Reservations</a>

    </nav>

</header>

<main>

    <section class="page-heading">

        <h1>Reserve a Table</h1>

        <p>
            Reservations are request only. Our chocolate shop is hidden
            beneath the city, so we review every request before
            confirming your table.
        </p>

    </section>

    <section class="reservation-section card">

        <div class="reservation-image">

            <img
                    src="./images/img3.png"
                    alt="Chocolate desserts at The Freepaw Underground">

        </div>

        <form action="#" method="post">

            <div class="form-group">

                <label for="name">Name</label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        maxlength="20"
                        required>

            </div>

            <div class="form-group">

                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        required>

            </div>

            <div class="form-group">

                <label for="party-size">Party Size</label>

                <select
                        id="party-size"
                        name="party-size"
                        required>

                    <option value="">Select party size</option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>

                </select>

            </div>

            <div class="form-group">

                <label for="date">Date</label>

                <input
                        type="date"
                        id="date"
                        name="date"
                        required>

            </div>

            <div class="form-group">

                <label for="time">Time</label>

                <input
                        type="time"
                        id="time"
                        name="time"
                        required>

            </div>

            <fieldset>

                <legend>Seating Preference</legend>

                <div class="radio-option">

                    <input
                            type="radio"
                            id="indoor"
                            name="seating"
                            value="indoor"
                            required>

                    <label for="indoor">
                        Underground Dining Room
                    </label>

                </div>

                <div class="radio-option">

                    <input
                            type="radio"
                            id="window"
                            name="seating"
                            value="window">

                    <label for="window">
                        Window Table
                    </label>

                </div>

                <div class="radio-option">

                    <input
                            type="radio"
                            id="communal"
                            name="seating"
                            value="communal">

                    <label for="communal">
                        Communal Table
                    </label>

                </div>

            </fieldset>

            <div class="form-group">

                <label for="dietary-notes">
                    Dietary Notes
                </label>

                <textarea
                        id="dietary-notes"
                        name="dietary-notes"
                        maxlength="30"
                        rows="4"
                        placeholder="Optional"></textarea>

            </div>

            <div class="checkbox-option">

                <input
                        type="checkbox"
                        id="newsletter"
                        name="newsletter"
                        value="yes">

                <label for="newsletter">
                    Sign me up for the Underground newsletter.
                </label>

            </div>

            <div class="button-group">

                <button type="submit">
                    Submit Request
                </button>

                <button type="reset">
                    Reset Form
                </button>

            </div>

        </form>

    </section>

</main>

<footer>

    <p>&copy; 2026 The Freepaw Underground</p>

</footer>

</body>
</html>
